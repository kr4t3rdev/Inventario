name: Mobile

on:
  pull_request:
    paths:
      - 'mobile/**'
  push:
    branches:
      - main
    paths:
      - 'mobile/**'

permissions:
  contents: read

jobs:
  reproducibility:
    name: Validate Expo reference client
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.22.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Install mobile dependencies
        run: pnpm --dir mobile install --frozen-lockfile

      - name: Run mobile tests
        run: pnpm --dir mobile test

      - name: Typecheck mobile client
        run: pnpm --dir mobile typecheck

      - name: Validate public Expo configuration
        run: pnpm --dir mobile exec expo config --type public
