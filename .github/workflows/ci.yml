name: CI

on:
  pull_request:
  push:
    branches: [main, 'codex/**']

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.22.0'
  DATABASE_URL: postgresql://test:test@127.0.0.1:5114/tcp_test_ci
  DIRECT_URL: postgresql://test:test@127.0.0.1:5114/tcp_test_ci

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: CI safety contracts
        run: pnpm run test:ci:contracts

      - name: Lint
        run: pnpm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

  test:
    name: Test (shard ${{ matrix.shard }}/${{ matrix.total }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
        total: [4]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm exec vitest run --maxWorkers=2 --coverage --reporter=blob --reporter=default --shard=${{ matrix.shard }}/${{ matrix.total }}

      - name: Upload unit blob reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unit-blob-${{ matrix.shard }}
          path: .vitest-reports
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, coverage, integration]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Cache Next.js build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

  integration:
    uses: ./.github/workflows/integration.yml

  coverage:
    name: Combined unit coverage
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: unit-blob-*
          path: .vitest-reports
          merge-multiple: true
      - name: Require all four shard reports
        run: test "$(find .vitest-reports -maxdepth 1 -name '*.json' -type f | wc -l)" -eq 4
      - name: Merge and enforce global coverage
        env:
          CI_COVERAGE_MERGE: '1'
        run: pnpm exec vitest run --merge-reports=.vitest-reports --coverage --reporter=default
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: combined-coverage
          path: coverage/
          if-no-files-found: error
          retention-days: 7

  required-checks:
    name: Required CI checks
    if: always()
    needs: [lint, typecheck, test, coverage, integration, build, post-deploy-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Reject failed, skipped, missing or cancelled checks
        env:
          REQUIRED_RESULTS: ${{ toJSON(needs) }}
          REQUIRE_POST_DEPLOY_SMOKE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: node scripts/ci/required-checks.mjs

  post-deploy-smoke:
    name: Post-deploy smoke (${{ matrix.target_environment }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.build.result == 'success'
    needs: [lint, typecheck, test, coverage, integration, build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target_environment: staging
            base_url: https://financemdm-staging-staging.up.railway.app
          - target_environment: production
            base_url: https://kr4t3rdev.xyz
    environment: ${{ format('FinanceMDM / {0}', matrix.target_environment) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Wait for exact deployment identity
        env:
          BASE_URL: ${{ matrix.base_url }}
          EXPECTED_DEPLOYMENT_ENVIRONMENT: ${{ matrix.target_environment }}
          EXPECTED_DEPLOYMENT_SHA: ${{ github.sha }}
        run: |
          node <<'NODE'
          const baseUrl = process.env.BASE_URL;
          const expectedEnvironment = process.env.EXPECTED_DEPLOYMENT_ENVIRONMENT;
          const expectedSha = process.env.EXPECTED_DEPLOYMENT_SHA;
          const deadline = Date.now() + 10 * 60 * 1000;

          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          (async () => {
            while (Date.now() < deadline) {
              try {
                const response = await fetch(`${baseUrl}/api/health`, {
                  headers: { accept: 'application/json' },
                });
                const body = await response.json();

                if (
                  response.ok &&
                  body.status === 'healthy' &&
                  body.deploymentEnvironment === expectedEnvironment &&
                  body.deploymentSha === expectedSha
                ) {
                  console.log(JSON.stringify(body));
                  process.exit(0);
                }

                console.log(
                  `Waiting for ${expectedEnvironment}/${expectedSha}; received ${JSON.stringify(body)}`,
                );
              } catch (error) {
                console.log(`Deployment not ready: ${error instanceof Error ? error.message : error}`);
              }

              await sleep(15_000);
            }

            console.error(`Timed out waiting for ${expectedEnvironment}/${expectedSha}`);
            process.exit(1);
          })();
          NODE

      - name: Run protected post-deploy smoke
        env:
          E2E_BASE_URL: ${{ matrix.base_url }}
          EXPECTED_DEPLOYMENT_ENVIRONMENT: ${{ matrix.target_environment }}
          EXPECTED_DEPLOYMENT_SHA: ${{ github.sha }}
        run: pnpm run test:smoke:prod
