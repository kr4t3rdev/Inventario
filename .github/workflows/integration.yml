name: Integration

on:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.22.0'

jobs:
  integration:
    name: Integration tests (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: tcp_test_ci
        ports:
          - '5432:5432'
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ALLOW_DISPOSABLE_TEST_DB: '1'
      DATABASE_URL: postgresql://test:test@127.0.0.1:5432/tcp_test_ci
      DATABASE_URL_TEST: postgresql://test:test@127.0.0.1:5432/tcp_test_ci
      DIRECT_URL: postgresql://test:test@127.0.0.1:5432/tcp_test_ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations
        run: pnpm exec prisma migrate deploy

      - name: Integration tests
        run: pnpm run test:integration
