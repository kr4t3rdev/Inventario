name: OpenAPI

on:
  pull_request:
    paths:
      - '.github/workflows/openapi.yml'
      - 'docs/openapi/**'
      - 'src/app/api/mobile/v1/**'
      - 'src/lib/openapi/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'redocly.yaml'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/openapi.yml'
      - 'docs/openapi/**'
      - 'src/app/api/mobile/v1/**'
      - 'src/lib/openapi/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'redocly.yaml'

permissions:
  contents: read

jobs:
  check:
    name: Validate mobile v1 contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read Node.js version
        id: node-version
        shell: bash
        run: echo "version=$(tr -d '[:space:]' < .nvmrc)" >> "$GITHUB_OUTPUT"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.22.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node-version.outputs.version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check OpenAPI contract
        run: pnpm run openapi:check
