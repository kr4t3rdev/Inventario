name: E2E Producción (smoke post-deploy)

# Chequeo manual post-deploy contra el host real de Railway.
# NO se ejecuta automáticamente en push/PR: el deploy de Railway es asíncrono
# respecto al push, así que una corrida automática validaría un deploy viejo
# o parcial (flaky/enganchado). Se dispara a mano desde "Run workflow" tras
# confirmar en Railway que el deploy activo es el esperado.
#
# El seed es OPCIONAL (checkbox): escribe contra la DB de producción
# (licencia + catálogo del tenant e2e-tenant) y es idempotente; por defecto
# se asume que los fixtures ya existen.

on:
  workflow_dispatch:
    inputs:
      run_seed:
        description: 'Ejecutar seed:e2e contra la DB de producción (idempotente)'
        required: false
        default: false
        type: boolean
      base_url:
        description: 'Host a validar (default: producción Railway)'
        required: false
        default: 'https://kr4t3rdev.xyz'
        type: string

permissions:
  contents: read

concurrency:
  group: e2e-prod-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.22.0'

jobs:
  e2e-prod:
    name: E2E Playwright contra producción
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Instalar navegador Chromium (Playwright)
        run: pnpm exec playwright install --with-deps chromium

      # Los specs E2E viven en e2e/ que está en .gitignore — verificar que
      # estén presentes en el checkout antes de continuar (solo hay versiones
      # locales en el workspace del desarrollador).
      - name: Verificar presencia de specs E2E
        run: |
          test -f e2e/servicios-cart.spec.ts || { echo "Specs E2E ausentes (e2e/ está en .gitignore). Crea los specs en el workspace y replica los archivos al repo o usa el comando local pnpm run test:e2e:prod."; exit 1; }

      - name: Semilla E2E opcional (DB de producción)
        if: ${{ inputs.run_seed }}
        run: pnpm run seed:e2e

      - name: Suite E2E contra producción
        env:
          E2E_BASE_URL: ${{ inputs.base_url }}
        run: pnpm run test:e2e:prod

      - name: Subir artefacto de reporte (si falla)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore