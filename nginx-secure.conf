# ============================================
# Nginx Security Configuration (Corregido)
# ============================================
# Las directivas limit_req_zone van en http context
# Este archivo debe incluirse en nginx.conf principal

server {
    listen 80;
    server_name localhost;

    # ============================================
    # LOGS
    # ============================================
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # ============================================
    # SECURITY HEADERS
    # ============================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ============================================
    # GZIP COMPRESSION
    # ============================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types text/plain text/css text/xml application/json application/javascript 
               application/rss+xml application/atom+xml image/svg+xml;

    # ============================================
    # GENERAL SETTINGS
    # ============================================
    client_max_body_size 50M;
    client_body_buffer_size 128k;
    
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    send_timeout 60s;
    
    server_tokens off;

    # ============================================
    # BLOQUEAR ARCHIVOS SENSIBLES
    # ============================================
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }
    
    location ~* ^/(\.env|\.git|\.htaccess|\.htpasswd|\.svn|\.DS_Store)$ {
        deny all;
        return 404;
    }
    
    location ~* \.(bak|config|sql|ini|log|sh|inc|swp)$ {
        deny all;
        return 404;
    }

    # ============================================
    # API ROUTES
    # ============================================
    location /api/ {
        proxy_pass http://inventario-app:3000;
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # ============================================
    # AUTH ROUTES - Protección contra brute force
    # ============================================
    location /api/auth/login {
        proxy_pass http://inventario-app:3000;
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        proxy_read_timeout 30s;
    }

    location /api/auth/register {
        proxy_pass http://inventario-app:3000;
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ============================================
    # HEALTH CHECK
    # ============================================
    location /api/health {
        proxy_pass http://inventario-app:3000;
        access_log off;
    }

    # ============================================
    # STATIC FILES
    # ============================================
    location /_next/static/ {
        proxy_pass http://inventario-app:3000;
        
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~* \.(ico|svg|woff|woff2|ttf|eot|otf|jpg|jpeg|png|gif|webp)$ {
        proxy_pass http://inventario-app:3000;
        
        expires 6M;
        add_header Cache-Control "public";
        access_log off;
    }

    # ============================================
    # MAIN APP
    # ============================================
    location / {
        proxy_pass http://inventario-app:3000;
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }

    # ============================================
    # ERROR PAGES
    # ============================================
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
