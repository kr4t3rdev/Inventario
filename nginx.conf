# ============================================
# Nginx Security Configuration
# ============================================

server {
    listen 80;
    server_name localhost;

    # ============================================
    # LOGS
    # ============================================
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # ============================================
    # SECURITY HEADERS
    # ============================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    
    # HSTS (descomentar si usas HTTPS)
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ============================================
    # RATE LIMITING - Protección contra ataques
    # ============================================
    # Limitar requests por IP
    limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=api:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=3r/s;
    
    # Limitar conexiones simultáneas
    limit_conn_zone $binary_remote_addr zone=addr:10m;

    # ============================================
    # GZIP COMPRESSION
    # ============================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types text/plain text/css text/xml application/json application/javascript 
               application/rss+xml application/atom+xml image/svg+xml 
               text/x-component text/x-cross-domain-policy;

    # ============================================
    # GENERAL SETTINGS
    # ============================================
    client_max_body_size 50M;
    client_body_buffer_size 128k;
    
    # Timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    send_timeout 60s;
    
    # Ocultar versión de nginx
    server_tokens off;

    # ============================================
    # BLOQUEAR ACCESO A ARCHIVOS SENSIBLES
    # ============================================
    # Archivos ocultos
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }
    
    # Archivos de configuración
    location ~* ^/(\.env|\.git|\.htaccess|\.htpasswd|\.svn|\.DS_Store|web\.config|package\.json|package-lock\.json)$ {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }
    
    # Extensiones peligrosas
    location ~* \.(bak|config|sql|fla|psd|ini|log|sh|inc|swp|dist)$ {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # ============================================
    # API ROUTES - Rate limiting estricto
    # ============================================
    location /api/ {
        limit_req zone=api burst=10 nodelay;
        limit_conn addr 10;
        
        proxy_pass http://inventario-app:3000;
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # No cachear API
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # ============================================
    # LOGIN - Protección especial contra brute force
    # ============================================
    location /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        limit_conn addr 3;
        
        proxy_pass http://inventario-app:3000;
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # Timeout más corto para login
        proxy_read_timeout 30s;
    }

    location /api/auth/register {
        limit_req zone=login burst=3 nodelay;
        limit_conn addr 2;
        
        proxy_pass http://inventario-app:3000;
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ============================================
    # HEALTH CHECK - Sin rate limit
    # ============================================
    location /api/health {
        proxy_pass http://inventario-app:3000;
        access_log off;
    }

    # ============================================
    # STATIC FILES - Cache agresivo
    # ============================================
    location /_next/static/ {
        proxy_pass http://inventario-app:3000;
        
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~* \.(ico|svg|woff|woff2|ttf|eot|otf|jpg|jpeg|png|gif|webp)$ {
        proxy_pass http://inventario-app:3000;
        
        expires 6M;
        add_header Cache-Control "public";
        access_log off;
    }

    # ============================================
    # MAIN APP
    # ============================================
    location / {
        limit_req zone=general burst=20 nodelay;
        limit_conn addr 20;
        
        proxy_pass http://inventario-app:3000;
        proxy_http_version 1.1;
        
        # Headers de proxy
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Buffering
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }

    # ============================================
    # ERROR PAGES
    # ============================================
    error_page 429 /429.html;
    location = /429.html {
        default_type text/html;
        return 429 '<!DOCTYPE html><html><head><title>429 Too Many Requests</title></head><body><h1>Demasiadas solicitudes</h1><p>Por favor espere antes de intentar nuevamente.</p></body></html>';
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
