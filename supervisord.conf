[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:postgresql]
command=/usr/lib/postgresql/%(program_name)s/bin/postgres -D /var/lib/postgresql/%(program_name)s/main
user=postgres
autostart=true
autorestart=true
stdout_logfile=/var/log/postgresql/postgresql.log
stderr_logfile=/var/log/postgresql/postgresql-error.log
priority=1

[program:nextjs]
command=node server.js
directory=/app/.next/standalone
autostart=true
autorestart=true
stdout_logfile=/var/log/nextjs/app.log
stderr_logfile=/var/log/nextjs/app-error.log
environment=NODE_ENV="production",PORT="3000"
priority=10
startsecs=10

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/var/log/nginx/nginx.log
stderr_logfile=/var/log/nginx/nginx-error.log
priority=20
startsecs=5
